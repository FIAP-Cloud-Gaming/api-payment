services:
# ======================================
# Infrastructure (DEV Ports)
# ======================================
  postgres:
    ports:
      - "5432:5432"

  elasticsearch:
    ports:
      - "9200:9200"

  jaeger:
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  loki:
    ports:
      - "3100:3100"

  promtail:
    ports:
      - "9080:9080"

  grafana:
    ports:
      - "3000:3000"

  rabbitmq:
    ports:
      - "5672:5672"
      - "15672:15672"

# ======================================
# Payment API (DEV Ports + Env)
# ======================================
  payment.api:
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__PaymentDB=Host=postgres;Port=5432;Database=payment_db;Username=postgres;Password=postgres
      - Elasticsearch__Uri=http://elasticsearch:9200
      - JwtSettings__Secret=your-super-secret-key-min-32-chars-long-for-development-only
      - JwtSettings__Issuer=fcg-identity-api
      - JwtSettings__Audience=fcg-services
      - ConnectionStrings__RabbitMQ=amqp://guest:guest@rabbitmq:5672
      - Loki__Uri=http://loki:3100
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
